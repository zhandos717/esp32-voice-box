<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Микрофон ESP32</title>
<style>
:root{--bg:var(--tg-theme-secondary-bg-color,#f4f5f6);--fg:var(--tg-theme-text-color,#161a1d);--mut:var(--tg-theme-hint-color,#5d6870);--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#fff));--line:color-mix(in srgb,var(--mut) 30%,transparent);--acc:var(--tg-theme-button-color,#0b7a6b);--acc-fg:var(--tg-theme-button-text-color,#fff);--rec:var(--tg-theme-destructive-text-color,#c62f2f)}
@media(prefers-color-scheme:dark){:root{--bg:var(--tg-theme-secondary-bg-color,#101416);--fg:var(--tg-theme-text-color,#e6ecef);--mut:var(--tg-theme-hint-color,#92a1a9);--card:var(--tg-theme-section-bg-color,var(--tg-theme-bg-color,#171d20));--line:color-mix(in srgb,var(--mut) 30%,transparent);--acc:var(--tg-theme-button-color,#4fcbb2);--acc-fg:var(--tg-theme-button-text-color,#fff);--rec:var(--tg-theme-destructive-text-color,#ff6b6b)}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(20px + var(--tg-content-safe-area-inset-top,0px)) calc(16px + var(--tg-safe-area-inset-right,0px)) calc(90px + var(--tg-safe-area-inset-bottom,0px)) calc(16px + var(--tg-safe-area-inset-left,0px));display:grid;gap:16px}
h1{font-size:22px;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut);font-size:13px}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
button.rec{background:var(--rec);border-color:var(--rec);color:var(--acc-fg)}button:disabled{opacity:.4;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block;margin-right:6px}.dot.on{background:var(--acc)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .12s}
audio{width:100%}.file{display:grid;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.new{color:var(--acc);font-size:12px;margin-left:6px}
.lamp{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px}.lamp i{width:22px;height:22px;border-radius:50%;background:var(--line);border:1px solid var(--mut);display:inline-block}.lamp i.on{background:var(--acc);box-shadow:0 0 10px var(--acc)}
button.led{background:var(--card);color:var(--fg);border-color:var(--line)}button.led.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.person{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px}.person b{overflow-wrap:anywhere}.person select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
@media(max-width:480px){.person{grid-template-columns:1fr}}
.vrow{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center}.vrow select{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:0}
@media(max-width:480px){.vrow{grid-template-columns:1fr}}
.tele{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.tele div{padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0}.tele small{display:block;color:var(--mut);font-size:12px}.tele b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.tele .bad b{color:var(--rec)}
.lang{display:flex;gap:4px;margin-left:auto}.lang button{padding:4px 10px;font-size:13px;background:var(--card);color:var(--fg);border-color:var(--line)}.lang button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));z-index:10}
.tabs button{display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;border:0;border-radius:0;background:none;color:var(--mut);font-size:11px;font-weight:600}.tabs button svg{width:24px;height:24px}.tabs button.on{color:var(--acc)}
[data-page][hidden]{display:none}
.snds{display:grid;gap:6px;margin-top:8px}.snd{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px}.snd.cur{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}.snd span{flex:1}.snd button{padding:6px 12px}
[v-cloak]{display:none}
</style>
<div id="app" v-cloak>
<main>
<div class="row"><h1>{{ t('title') }}</h1><div class="lang" role="group" aria-label="Language"><button v-for="l in ['ru','kk','en']" :class="{on:lang===l}" @click="setLang(l)">{{ l==='kk'?'KZ':l.toUpperCase() }}</button></div></div>

<template v-if="page==='home'">
<section class="card">
<div class="row"><span><i class="dot" :class="{on:st.connected}"></i>{{ st.connected?t('online'):t('waiting') }}</span><span class="mut">{{ st.connected?st.peer:'' }}</span></div>
<div class="bar"><i :style="{width:Math.min(100,(st.level||0)/40)+'%'}"></i></div>
<div class="row"><button :class="{rec:st.recording}" :disabled="!st.connected" @click="toggleRec">{{ st.recording?t('stop'):t('record') }}</button><span class="mut" v-if="st.recording">{{ t('recording',(st.seconds||0).toFixed(0)) }}</span></div>
</section>
<section class="card"><strong>{{ t('recs') }}</strong>
<div class="mut" v-if="!files.length">{{ t('none') }}</div>
<div class="file" v-for="f in files" :key="f.name"><span>{{ f.name }} <b class="new" v-if="!f.played">{{ t('newRec') }}</b></span>
<audio controls preload="none" :src="'/rec/'+f.name" @play="markPlayed(f)"></audio></div>
</section>
</template>

<section class="card" v-if="page==='voice'">
<strong>{{ t('voice') }}</strong>
<div class="mut">{{ voices.ready===false?t('vNoTts'):t('vNote') }}</div>
<label class="vrow" v-for="l in ['ru','kk']" :key="l"><span>{{ t(l) }}</span>
<select v-model="voices.current[l]" @change="selectVoice(l,voices.current[l])"><option value="">{{ t('fromEnv') }}</option><option v-for="p in presetsFor(l)" :value="p.id">{{ p.name }}</option></select>
<button class="led" @click.prevent="testVoice(l)">{{ t('listen') }}</button></label>
<span class="mut">{{ vMsg }}</span>
<div><b>{{ t('people') }}</b><div class="mut">{{ t('peopleNote') }}</div>
<div class="snds"><span class="mut" v-if="!voices.senders.length">{{ t('nobody') }}</span>
<div class="person" v-for="p in voices.senders" :key="p.id"><b>{{ p.name||('id '+p.id) }}</b>
<select v-for="l in ['ru','kk']" :key="l" v-model="p[l]" :aria-label="t(l)+': '+p.name" @change="selectVoice(l,p[l],p)"><option value="">{{ t(l+'Def') }}</option><option v-for="v in presetsFor(l)" :value="v.id">{{ v.name }}</option></select>
</div></div></div>
</section>

<section class="card" v-if="page==='sounds'">
<strong>{{ t('sounds') }}</strong>
<div class="mut">{{ t('soundsNote') }}</div>
<div v-for="kind in ['notify','boot']" :key="kind"><b>{{ t(kind) }}</b><div class="snds">
<div class="snd" v-for="x in sounds[kind]" :key="x.id" :class="{cur:sounds.current[kind]===x.id}"><span>{{ x.name }}{{ sounds.current[kind]===x.id?t('chosen'):'' }}</span>
<button class="led" v-if="x.id" @click="sound('play',kind,x.id)">▶</button><button @click="sound('select',kind,x.id)">{{ t('choose') }}</button></div>
</div></div>
</section>

<template v-if="page==='board'">
<section class="card">
<div class="row"><strong>{{ t('tele') }}</strong><span class="mut">{{ st.teleAge!=null?t('ago',dur(st.teleAge)):'' }}</span></div>
<div class="tele" v-if="st.tele"><div v-for="r in teleRows" :key="r[0]" :class="{bad:r[2]}"><small>{{ r[0] }}</small><b>{{ r[1] }}</b></div></div>
<span class="mut" v-else>{{ t('teleWait') }}</span>
</section>
<section class="card">
<strong>{{ t('fwTitle') }}</strong>
<div class="row"><span class="mut">{{ t('onBoard') }} <b>{{ st.fw||t('unknown') }}</b></span></div>
<div class="row"><button :disabled="!st.connected||st.otaBusy" @click="ota">{{ t('otaBtn') }}</button><span class="mut">{{ st.otaBusy?t('otaBusy'):otaMsg }}</span></div>
<span class="mut">{{ t('otaNote') }}</span>
</section>
<section class="card">
<strong>{{ t('check') }}</strong>
<label class="row"><input type="checkbox" :checked="st.test" @change="setTest($event.target.checked)"> <span>{{ t('testMode') }}</span></label>
<div class="row">
<div class="lamp"><i :class="{on:st.btnRec}"></i><span>{{ t('btnRec') }}<br><small class="mut">GPIO 27, {{ t('presses') }} <b>{{ st.recPresses||0 }}</b></small></span></div>
<div class="lamp"><i :class="{on:st.btnNext}"></i><span>{{ t('btnNext') }}<br><small class="mut">GPIO 13, {{ t('presses') }} <b>{{ st.nextPresses||0 }}</b></small></span></div>
</div>
<div class="row"><button class="led" v-for="i in [0,1,2]" :key="i" :class="{on:leds[i]}" @click="led(i)">{{ t('led'+i) }}</button></div>
</section>
</template>
</main>

<nav class="tabs">
<button v-for="tb in tabs" :key="tb.id" :class="{on:page===tb.id}" :aria-current="page===tb.id?'page':null" @click="show(tb.id)">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" v-html="tb.icon"></svg><span>{{ t(tb.label) }}</span></button>
</nav>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(async()=>{const tg=window.Telegram&&Telegram.WebApp;if(!tg||!tg.initData)return;tg.ready();tg.expand();
if(tg.isVersionAtLeast('6.1')){tg.setHeaderColor('secondary_bg_color');tg.setBackgroundColor('secondary_bg_color')}
document.addEventListener('click',e=>{if(e.target.closest('button')&&tg.isVersionAtLeast('6.1'))tg.HapticFeedback.impactOccurred('light')});

if((await fetch("/api/status")).status===401&&(await fetch("/auth",{method:"POST",body:tg.initData})).ok)location.reload()})();
</script>

data:()=>({lang:store.get('lang')||(tgLang in T?tgLang:'ru'),page:store.get('page')||'home',
st:{},files:[],voices:{presets:[],current:{ru:'',kk:''},senders:[],ready:true},sounds:{notify:[],boot:[],current:{}},
vMsg:'',otaMsg:'',leds:[false,false,false],
tabs:[{id:'home',label:'tabHome',icon:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'},
{id:'voice',label:'tabVoice',icon:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'},
{id:'sounds',label:'tabSounds',icon:'<path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>'},
{id:'board',label:'tabBoard',icon:'<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/>'}]}),
computed:{
teleRows(){const s=this.st,m=s.tele||{},t=this.t,dur=this.dur,kb=x=>x==null?'—':(x/1024).toFixed(0)+' '+t('kb');return [
[t('tRssi'),m.rssi!=null?m.rssi+' dBm':'—',m.rssi<-80],[t('tCh'),m.channel!=null?m.channel+' · '+m.bssid:'—'],
[t('tTx'),m.txPower!=null?m.txPower+' dBm':'—'],[t('tIp'),m.ip||'—'],
[t('tUp'),dur(m.uptime)],[t('tReset'),m.reset||'—',!!m.reset&&/wdt|panic|brownout/.test(m.reset)],
[t('tLink'),s.connected?dur(s.connectedFor):t('no'),!s.connected],[t('tConn'),(m.serverConnects??'—')+' / '+s.connects],
[t('tDrops'),m.wifiDrops!=null?m.wifiDrops+(m.wifiDrops?' ('+t('tCode')+' '+m.lastDropReason+')':''):'—',m.wifiDrops>0],
[t('tCodec'),s.adpcm?'ADPCM':t('tPcm')],[t('tHeap'),kb(m.heap)+' ('+t('tMinShort')+' '+kb(m.heapMin)+')',m.heapMin<40000],
[t('tBlock'),kb(m.heapBlock)],[t('tCpu'),m.cpuMHz?m.cpuMHz+' '+t('tMhz'):'—'],
[t('tGap'),m.loopMaxGapMs!=null?m.loopMaxGapMs+' '+t('tMs'):'—',m.loopMaxGapMs>1000],
[t('tLost'),m.micDropped!=null?m.micDropped+' '+t('tSamples'):'—',m.micDropped>0],
[t('tBuf'),kb(m.micBufFreeMin),m.micBufFreeMin<4096],
[t('tUnder'),m.playUnderruns??'—',m.playUnderruns>0],[t('tUnplayed'),s.unplayed],
[t('tTrial'),m.otaTrial?t('yes'):t('no')]]}},
watch:{
lang:{handler(l){store.set('lang',l);document.documentElement.lang=l;document.title=this.t('title')},immediate:true},
page(p){store.set('page',p);scrollTo(0,0)},
'st.files'(){this.loadFiles()},'st.unplayed'(){this.loadFiles()}},
methods:{
t(k,...a){return (T[this.lang][k]??T.ru[k]??k).replace(/\{(\d)\}/g,(_,i)=>a[i])},
dur(x){const t=this.t;return x==null?'—':x<60?x+' '+t('s'):x<3600?Math.floor(x/60)+' '+t('min'):Math.floor(x/3600)+' '+t('h')+' '+Math.floor(x%3600/60)+' '+t('min')},
setLang(l){this.lang=l},
show(p){this.page=p},
presetsFor(l){return this.voices.presets.filter(p=>p.kk===(l==='kk'))},
async loadStatus(){try{this.st=await (await fetch('/api/status')).json()}catch(e){}},
stream(){let poll=null;const es=new EventSource('/api/events');
es.onmessage=e=>{if(poll){clearInterval(poll);poll=null}this.st=JSON.parse(e.data)};
es.onerror=()=>{if(!poll)poll=setInterval(()=>this.loadStatus(),2000)}},
async loadFiles(){if([...document.querySelectorAll('audio')].some(a=>!a.paused))return;try{this.files=await (await fetch('/api/list')).json()}catch(e){}},
markPlayed(f){if(!f.played){f.played=true;post('/api/mark/'+f.name)}},
async toggleRec(){await post(this.st.recording?'/api/stop':'/api/start');this.loadStatus()},
async loadVoices(){try{const d=await (await fetch('/api/voices')).json();d.current={ru:'',kk:'',...d.current};this.voices=d}catch(e){}},
async selectVoice(lang,id,person){let u='/api/voice/select?lang='+lang+'&id='+encodeURIComponent(id||'');if(person)u+='&user='+person.id;
const r=await post(u);this.vMsg=r.ok?(person?this.t('savedFor',person.name||person.id):this.t('saved')):this.t('notSaved')},
async testVoice(lang){this.vMsg=this.t('speaking');const r=await (await post('/api/voice/test?lang='+lang+'&id='+encodeURIComponent(this.voices.current[lang]||''))).json();this.vMsg=r.ok?this.t('playing'):r.error},
async loadSounds(){try{this.sounds=await (await fetch('/api/sounds')).json()}catch(e){}},
async sound(a,kind,id){const r=await (await post('/api/sound/'+a+'?kind='+kind+'&id='+id)).json();if(!r.ok)say(r.error);if(a==='select')this.loadSounds()},
async ota(){if(!await ask(this.t('otaAsk')))return;const r=await (await post('/api/ota')).json();this.otaMsg=r.ok?this.t('otaSent',Math.round(r.bytes/1024)):r.error},
setTest(on){post('/api/test?on='+(on?1:0))},
async led(i){const on=!this.leds[i];const r=await (await post('/api/led?id='+i+'&on='+(on?1:0))).json();if(r.ok)this.leds[i]=on}},
mounted(){this.loadStatus();this.stream();this.loadFiles();this.loadVoices();this.loadSounds();}
}).mount('#app');
</script></html>
